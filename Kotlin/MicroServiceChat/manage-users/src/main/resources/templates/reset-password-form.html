<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialisation du mot de passe</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 480px;
      width: 100%;
      background: #1e293b;
      border-radius: 32px;
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
      animation: fadeInScale 0.6s ease-out;
    }

    .container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.05) 0%, transparent 70%);
      animation: rotate 20s infinite linear;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
      position: relative;
      z-index: 1;
    }

    .lock-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #7c3aed 0%, #8b5cf6 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      animation: pulse 2s infinite;
      box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.5);
    }

    .lock-icon svg {
      width: 40px;
      height: 40px;
      fill: none;
      stroke: white;
      stroke-width: 2;
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.7);
      }
      50% {
        box-shadow: 0 0 0 15px rgba(124, 58, 237, 0);
      }
    }

    h1 {
      color: #f1f5f9;
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 8px 0;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
    }

    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
      color: #fecaca;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: slideIn 0.3s ease;
    }

    .error::before {
      content: '⚠️';
      font-size: 18px;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-group {
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      background: #2d3a4f;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 14px 16px;
      color: #f1f5f9;
      font-size: 15px;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-wrapper input:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
    }

    .input-wrapper input::placeholder {
      color: #64748b;
    }

    .password-strength {
      margin-top: 12px;
      padding: 12px;
      background: #2d3a4f;
      border-radius: 12px;
      border: 1px solid #334155;
    }

    .strength-bar {
      height: 4px;
      background: #334155;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .strength-fill {
      height: 100%;
      width: 0;
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    .strength-fill.weak { background: #ef4444; }
    .strength-fill.medium { background: #f59e0b; }
    .strength-fill.strong { background: #10b981; }

    .strength-text {
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }

    .strength-text span.weak { color: #ef4444; }
    .strength-text span.medium { color: #f59e0b; }
    .strength-text span.strong { color: #10b981; }

    .requirements {
      margin: 16px 0;
      padding: 16px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
    }

    .requirement {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      color: #94a3b8;
      font-size: 13px;
      transition: color 0.2s ease;
    }

    .requirement.valid {
      color: #10b981;
    }

    .requirement::before {
      content: '○';
      font-size: 16px;
      color: #64748b;
    }

    .requirement.valid::before {
      content: '✓';
      color: #10b981;
    }

    button {
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, #7c3aed 0%, #8b5cf6 100%);
      border: none;
      border-radius: 16px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      z-index: 1;
      margin-top: 24px;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.5);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    button.loading .spinner {
      display: inline-block;
    }

    button.loading span {
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 14px;
      transition: all 0.2s ease;
      padding: 8px 16px;
      border-radius: 8px;
    }

    .back-link:hover {
      color: #8b5cf6;
      background: #2d3a4f;
      gap: 10px;
    }

    .back-link::before {
      content: '←';
      font-size: 18px;
    }

    .floating-shape {
      position: absolute;
      width: 150px;
      height: 150px;
      background: linear-gradient(135deg, #7c3aed 0%, #8b5cf6 100%);
      border-radius: 50%;
      opacity: 0.05;
      animation: float 20s infinite ease-in-out;
    }

    .floating-shape:nth-child(1) {
      top: -50px;
      right: -50px;
      animation-delay: 0s;
    }

    .floating-shape:nth-child(2) {
      bottom: -50px;
      left: -50px;
      animation-delay: -5s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(30px, -30px) scale(1.1); }
      50% { transform: translate(-20px, 20px) scale(0.9); }
      75% { transform: translate(40px, 40px) scale(1.05); }
    }

    @media (max-width: 480px) {
      .container {
        padding: 32px 24px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
<div class="floating-shape"></div>
<div class="floating-shape"></div>

<div class="container">
  <div class="header">
    <div class="lock-icon">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <h1>Réinitialisation du mot de passe</h1>
    <p class="subtitle">Choisissez un mot de passe sécurisé pour votre compte</p>
  </div>

  <!-- Message d'erreur si le token est invalide -->
  <div th:if="${error}" class="error" th:text="${error}"></div>

  <form th:action="@{/api/auth/reset-password}" method="post" id="resetForm">
    <!-- Token caché -->
    <input type="hidden" name="token" id="token" th:value="${token}" />

    <div class="form-group">
      <label for="newPassword">Nouveau mot de passe</label>
      <div class="input-wrapper">
        <input type="password" id="newPassword" name="newPassword"
               placeholder="Entrez votre nouveau mot de passe" required />
      </div>
    </div>

    <!-- Password strength indicator (sera mis à jour via JS) -->
    <div class="password-strength" id="passwordStrength" style="display: none;">
      <div class="strength-bar">
        <div class="strength-fill" id="strengthFill"></div>
      </div>
      <div class="strength-text">
        <span id="strengthLabel">Faible</span>
        <span id="strengthPercent">0%</span>
      </div>
    </div>

    <!-- Password requirements -->
    <div class="requirements" id="requirements">
      <div class="requirement" id="reqLength">Au moins 8 caractères</div>
      <div class="requirement" id="reqUppercase">Une lettre majuscule</div>
      <div class="requirement" id="reqLowercase">Une lettre minuscule</div>
      <div class="requirement" id="reqNumber">Un chiffre</div>
      <div class="requirement" id="reqSpecial">Un caractère spécial</div>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirmer le mot de passe</label>
      <div class="input-wrapper">
        <input type="password" id="confirmPassword" name="confirmPassword"
               placeholder="Confirmez votre mot de passe" required />
      </div>
    </div>

    <button type="submit" id="submitBtn">
      <span>Réinitialiser le mot de passe</span>
      <div class="spinner"></div>
    </button>
  </form>

  <div class="footer">
    <a th:href="@{/auth/login}" class="back-link">
      Retour à la connexion
    </a>
  </div>
</div>

<script>
  (function() {
    const form = document.getElementById('resetForm');
    const newPassword = document.getElementById('newPassword');
    const confirmPassword = document.getElementById('confirmPassword');
    const submitBtn = document.getElementById('submitBtn');
    const passwordStrength = document.getElementById('passwordStrength');
    const strengthFill = document.getElementById('strengthFill');
    const strengthLabel = document.getElementById('strengthLabel');
    const strengthPercent = document.getElementById('strengthPercent');

    const reqLength = document.getElementById('reqLength');
    const reqUppercase = document.getElementById('reqUppercase');
    const reqLowercase = document.getElementById('reqLowercase');
    const reqNumber = document.getElementById('reqNumber');
    const reqSpecial = document.getElementById('reqSpecial');

    // Password validation
    function validatePassword(password) {
      return {
        length: password.length >= 8,
        uppercase: /[A-Z]/.test(password),
        lowercase: /[a-z]/.test(password),
        number: /[0-9]/.test(password),
        special: /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password)
      };
    }

    // Calculate password strength
    function calculateStrength(validation) {
      let score = 0;
      if (validation.length) score += 20;
      if (validation.uppercase) score += 20;
      if (validation.lowercase) score += 20;
      if (validation.number) score += 20;
      if (validation.special) score += 20;
      return score;
    }

    // Update UI based on password
    function updatePasswordStrength() {
      const password = newPassword.value;

      if (password.length === 0) {
        passwordStrength.style.display = 'none';
        return;
      }

      passwordStrength.style.display = 'block';

      const validation = validatePassword(password);
      const strength = calculateStrength(validation);

      // Update strength bar
      strengthFill.style.width = strength + '%';
      strengthFill.className = 'strength-fill';
      if (strength < 40) {
        strengthFill.classList.add('weak');
        strengthLabel.textContent = 'Faible';
      } else if (strength < 70) {
        strengthFill.classList.add('medium');
        strengthLabel.textContent = 'Moyen';
      } else {
        strengthFill.classList.add('strong');
        strengthLabel.textContent = 'Fort';
      }
      strengthPercent.textContent = strength + '%';

      // Update requirements
      reqLength.classList.toggle('valid', validation.length);
      reqUppercase.classList.toggle('valid', validation.uppercase);
      reqLowercase.classList.toggle('valid', validation.lowercase);
      reqNumber.classList.toggle('valid', validation.number);
      reqSpecial.classList.toggle('valid', validation.special);
    }

    // Check if passwords match
    function passwordsMatch() {
      return newPassword.value === confirmPassword.value;
    }

    // Update submit button state
    function updateSubmitButton() {
      const validation = validatePassword(newPassword.value);
      const strength = calculateStrength(validation);
      const isValid = strength >= 40 && passwordsMatch() && newPassword.value.length > 0;

      submitBtn.disabled = !isValid;
    }

    // Event listeners
    newPassword.addEventListener('input', () => {
      updatePasswordStrength();
      updateSubmitButton();
    });

    confirmPassword.addEventListener('input', updateSubmitButton);

    // Form submission
    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const token = document.getElementById('token').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      // Show loading state
      submitBtn.classList.add('loading');
      submitBtn.disabled = true;

      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword, confirmPassword })
        });

        const data = await response.json();

        if (response.ok) {
          // Success - show success message and redirect
          alert('✓ Mot de passe réinitialisé avec succès !');
          window.location.href = 'http://localhost:4200/auth/login';
        } else {
          // Error - show error message
          alert('❌ ' + (data.message || 'Une erreur est survenue'));
          submitBtn.classList.remove('loading');
          submitBtn.disabled = false;
        }
      } catch (error) {
        alert('❌ Erreur de connexion au serveur');
        submitBtn.classList.remove('loading');
        submitBtn.disabled = false;
      }
    });
  })();
</script>
</body>
</html>
