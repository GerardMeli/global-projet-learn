<div class="chat-forgot">
  <!-- Background -->
  <div class="chat-bg">
    <div class="chat-grid"></div>
  </div>

  <!-- Container -->
  <div class="chat-container">
    <div class="forgot-card">
      <!-- Back Button -->
      <a routerLink="/auth/login" class="back-button">
        <mat-icon>arrow_back</mat-icon>
        Back to sign in
      </a>

      <!-- Content -->
      <ng-container *ngIf="!sent; else sentBlock">
        <!-- Header -->
        <div class="forgot-header">
          <div class="icon-circle">
            <mat-icon>lock_reset</mat-icon>
          </div>
          <h1>Forgot password?</h1>
          <p>No worries, we'll send you reset instructions.</p>
        </div>

        <!-- Error Alert -->
        <div *ngIf="errorMessage" class="chat-alert error">
          <mat-icon>error_outline</mat-icon>
          <span>{{ errorMessage }}</span>
        </div>

        <!-- Form -->
        <form [formGroup]="form" (ngSubmit)="submit()" class="forgot-form">
          <div class="field-wrap">
            <input class="field-input" type="email" formControlName="email" placeholder=" " id="forgotEmail" autocomplete="email">
            <label class="field-label" for="forgotEmail">Email address</label>
            <span class="field-icon"><mat-icon>mail_outline</mat-icon></span>
          </div>

          <button type="submit" class="forgot-button" [disabled]="loading">
            <span *ngIf="!loading">Send reset link</span>
            <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>
          </button>
        </form>

        <!-- Info -->
        <div class="info-message">
          <mat-icon>schedule</mat-icon>
          <span>Link expires in 30 minutes</span>
        </div>
      </ng-container>

      <!-- Sent State -->
      <ng-template #sentBlock>
        <div class="success-state">
          <div class="success-animation">
            <div class="mail-icon">
              <mat-icon>mark_email_read</mat-icon>
            </div>
          </div>
          
          <h2>Check your inbox</h2>
          <p class="success-message">
            We've sent a reset link to <strong>{{ email }}</strong>
          </p>
          
          <div class="success-actions">
            <button class="chat-button secondary" (click)="sent = false">
              <mat-icon>edit</mat-icon>
              Use different email
            </button>
            <button class="chat-button primary" routerLink="/auth/login">
              <mat-icon>check</mat-icon>
              Done
            </button>
          </div>
        </div>
      </ng-template>
    </div>
  </div>
</div>
