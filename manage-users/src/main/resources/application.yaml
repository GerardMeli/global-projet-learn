spring:
  application:
    name: manage-users
  profiles:
    active: dev  # Activer le profil dev

  # Database configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/management_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  session:
    store-type: jdbc

  # Hibernate properties
  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Thymeleaf
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
    check-template-location: true
    servlet:
      content-type: text/html
    enabled: true

  # Mail configuration - DISABLED for development
  # Ne pas activer spring.mail car nous utilisons MockJavaMailSender
